<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Week 2 API</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 60px auto;
      padding: 0 20px;
      color: #222;
    }
    h1 { color: #c0392b; }
    code {
      background: #f4f4f4;
      padding: 2px 6px;
      border-radius: 4px;
    }
    li { margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>My Week 2 API!</h1>
  <p>This static page is served at <code>GET /</code> by Express.</p>
  <ul>
    <li><code>GET /</code> → this page</li>
    <li><code>GET /api</code> → JSON welcome message</li>
    <li><code>POST /user</code> → send { "name": "...", "email": "..." }</li>
    <li><code>GET /user/:id</code> → returns a profile message for that id</li>
  </ul>
</body>
</html>
